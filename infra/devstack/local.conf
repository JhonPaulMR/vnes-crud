# =====================================================================
# local.conf do DevStack - VM vnes-cloud (192.168.50.20)
# Branch: stable/2026.2 (OpenStack "Hibiscus") em Ubuntu 24.04 (noble)
# O script 01-preparar-host.sh troca TROCAR_SENHA pela senha escolhida.
# Senha: somente letras e numeros (o DevStack nao gosta de caracteres especiais).
# =====================================================================
[[local|localrc]]

# ---- Rede do host ----------------------------------------------------
HOST_IP=192.168.50.20
HOST_IP_IFACE=eth0
SERVICE_HOST=$HOST_IP

# ---- Senhas (uma so, reaproveitada em tudo) --------------------------
ADMIN_PASSWORD=TROCAR_SENHA
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

# ---- Rede externa (padrao do DevStack, explicitada) ------------------
# Sem PUBLIC_INTERFACE, o DevStack cria o br-ex com 172.24.4.1/24 e adiciona
# uma regra iptables MASQUERADE (172.24.4.0/24 -> eth0) para as instancias
# acessarem a internet. A regra NAO persiste apos reboot (ver README.md).
FLOATING_RANGE=172.24.4.0/24
PUBLIC_NETWORK_GATEWAY=172.24.4.1

# ---- Virtualizacao ---------------------------------------------------
# Virtualizacao aninhada habilitada no Hyper-V
LIBVIRT_TYPE=kvm

# ---- Servicos: so o necessario (VM com 6 GB de RAM + 4 GB de swap) ----------------
# Mantidos (padroes): keystone, glance, placement, nova, neutron com OVN,
# horizon, mysql, rabbit, etcd.
disable_service tempest
disable_service c-sch c-api c-vol                         # Cinder desligado
disable_service s-proxy s-object s-container s-account    # Swift desligado

# MySQL com menos memoria
MYSQL_REDUCE_MEMORY=True

# ---- Imagens ---------------------------------------------------------
# Nao baixar a imagem cirros; a Ubuntu 24.04 e enviada pelo 03-preparar-admin.sh
DOWNLOAD_DEFAULT_IMAGES=False

# ---- Logs e repositorios ---------------------------------------------
LOGFILE=/opt/stack/logs/stack.sh.log
LOG_COLOR=False
LOGDAYS=2
GIT_BASE=https://opendev.org
