# Copiar para /etc/netplan/50-vnes.yaml na VM vnes-cloud e aplicar:
#   sudo hostnamectl set-hostname cloud
#   sudo cp vnes-cloud.yaml /etc/netplan/50-vnes.yaml
#   sudo chmod 600 /etc/netplan/50-vnes.yaml
#   sudo netplan apply
# Mova para .bak os YAMLs gerados pelo instalador (ex.: /etc/netplan/50-cloud-init.yaml) e
# desative a rede do cloud-init: echo "network: {config: disabled}" | sudo tee /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
# ATENCAO: faca isto ANTES do stack.sh do DevStack (o DevStack depois muda o eth0/br-ex).
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      dhcp4: false
      addresses:
        - 192.168.50.20/24
      routes:
        - to: default
          via: 192.168.50.1
      nameservers:
        addresses: [192.168.50.10]
        search: [vnes.com.br]
