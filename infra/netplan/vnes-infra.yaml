# Copiar para /etc/netplan/50-vnes.yaml na VM vnes-infra e aplicar:
#   sudo hostnamectl set-hostname ns1
#   sudo cp vnes-infra.yaml /etc/netplan/50-vnes.yaml
#   sudo chmod 600 /etc/netplan/50-vnes.yaml
#   sudo netplan apply
# Mova para .bak os YAMLs gerados pelo instalador (ex.: /etc/netplan/50-cloud-init.yaml) e
# desative a rede do cloud-init: echo "network: {config: disabled}" | sudo tee /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      dhcp4: false
      addresses:
        - 192.168.50.10/24
      routes:
        - to: default
          via: 192.168.50.1
        # Rede publica do DevStack, alcancada pela vnes-cloud
        - to: 172.24.4.0/24
          via: 192.168.50.20
      nameservers:
        # Ela mesma e o servidor DNS (Bind); 1.1.1.1 como reserva
        addresses: [127.0.0.1, 1.1.1.1]
        search: [vnes.com.br]
